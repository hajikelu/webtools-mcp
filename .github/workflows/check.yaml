name: Check
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, and dependency code runs in later steps: keep GITHUB_TOKEN out of their reach.
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # As in deploy.yaml. A cache would save only the few seconds of Node.js and pnpm downloads.
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
